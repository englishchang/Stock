name: 更新期交所 + 加密貨幣數據

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - crypto_only
          - taifex_only
          - margin_only

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝工具
        run: sudo apt-get install -y wget

      # 加密貨幣：每次都跑
      - name: 抓取 BTC / DOGE 數據
        if: github.event.inputs.mode != 'taifex_only' && github.event.inputs.mode != 'margin_only'
        run: python scripts/fetch_crypto.py

      # 融資融券（扣除ETF）：每次都跑
      - name: 抓取融資融券數據（扣除ETF）
        if: github.event.inputs.mode != 'taifex_only' && github.event.inputs.mode != 'crypto_only'
        run: python scripts/fetch_margin.py

      # 台股期貨：UTC 08:00 週一至週五，或手動指定
      - name: 判斷是否需要抓台股期貨
        id: check_taifex
        run: |
          HOUR=$(date -u +%H)
          WDAY=$(date -u +%u)
          MODE="${{ github.event.inputs.mode }}"
          echo "UTC: $(date -u)  HOUR=$HOUR  WDAY=$WDAY  MODE=$MODE"
       -   if [[ "$MODE" == "taifex_only" || "$MODE" == "all" ]]; then
       -     echo "run=true" >> $GITHUB_OUTPUT
       -   elif [[ "$HOUR" == "00" && "$WDAY" -le 6 ]]; then
            echo "run=true" >> $GITHUB_OUTPUT
       -  else
       -     echo "run=false" >> $GITHUB_OUTPUT
       -   fi

      - name: 抓取期交所數據
        if: steps.check_taifex.outputs.run == 'true'
        id: fetch_taifex
        run: python scripts/fetch_taifex.py
        continue-on-error: true

      - name: 若失敗 30 秒後重試
        if: steps.fetch_taifex.outcome == 'failure'
        run: |
          sleep 30
          python scripts/fetch_taifex.py

      - name: 顯示最新數據
        run: cat data.json

      - name: Commit & Push data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "無變更，跳過" && exit 0
          git commit -m "chore: 自動更新數據 $(date +'%Y/%m/%d %H:%M UTC') [skip ci]"
          for i in 1 2 3 4 5; do
            echo "=== Push 嘗試 $i/5 ==="
            if git push origin main; then
              echo "✅ Push 成功"
              exit 0
            fi
            cp data.json /tmp/data_latest.json
            git fetch origin main
            git merge -X ours origin/main --no-edit 2>/dev/null || true
            cp /tmp/data_latest.json data.json
            git add data.json
            git diff --cached --quiet || \
              git commit -m "chore: 合併後更新 $(date +'%Y/%m/%d %H:%M UTC') [skip ci]"
            sleep $((i * 3))
          done
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
