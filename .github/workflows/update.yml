name: 更新期交所 + 加密貨幣數據

on:
  schedule:
    - cron: "0 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - crypto_only
          - taifex_only

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝工具
        run: sudo apt-get install -y wget

      - name: 抓取 BTC / DOGE 數據
        if: github.event.inputs.mode != 'taifex_only'
        run: python scripts/fetch_crypto.py

      - name: 判斷是否需要抓台股期貨
        id: check_taifex
        run: |
          HOUR=$(date -u +%H)
          WDAY=$(date -u +%u)
          MODE="${{ github.event.inputs.mode }}"
          echo "UTC: $(date -u) HOUR=$HOUR WDAY=$WDAY"
          if [[ "$MODE" == "taifex_only" || "$MODE" == "all" ]]; then
            echo "run=true" >> $GITHUB_OUTPUT
          elif [[ "$HOUR" == "08" && "$WDAY" -le 5 ]]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: 抓取期交所數據（含重試）
        if: steps.check_taifex.outputs.run == 'true'
        id:
